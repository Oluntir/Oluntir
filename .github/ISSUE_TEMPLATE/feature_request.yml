name: Feature request
description: Propose a practical improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What real task should become easier or possible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Project fit
      options:
        - label: The proposal preserves offline use.
        - label: The proposal preserves standard HTML/CSS/JavaScript output.
        - label: New third-party material can be licensed and documented.
